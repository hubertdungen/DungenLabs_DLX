<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800"
     role="img" aria-label="Technical drawing of the DL X Commander deck box: front elevation and section, dimensioned in millimetres">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="rgba(235,130,108,0.10)" stroke-width="1"/>
    </pattern>
    <style>
      .shell  { fill: #0e2c33; stroke: rgba(244,248,248,0.85); stroke-width: 2; }
      .lid    { fill: #16424c; stroke: rgba(244,248,248,0.85); stroke-width: 2; }
      .bumper { fill: rgba(235,130,108,0.16); stroke: #EB826C; stroke-width: 1.5; }
      .groove { stroke: rgba(244,248,248,0.28); stroke-width: 3; stroke-linecap: round; }
      .hinge  { stroke: #EB826C; stroke-width: 3; stroke-linecap: round; }
      .latch  { fill: #EB826C; }
      .cavity { fill: rgba(5,6,6,0.5); stroke: rgba(244,248,248,0.35);
                 stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cards  { fill: rgba(235,130,108,0.13); stroke: #EB826C; stroke-width: 1.5; }
      .card-edge { stroke: rgba(235,130,108,0.55); stroke-width: 1; }
      .dim line   { stroke: rgba(244,248,248,0.4); stroke-width: 1; }
      .dim text   { fill: #F4F8F8; font-family: Orbitron, Arial, sans-serif;
                     font-size: 15px; letter-spacing: 0.06em; }
      .callout line   { stroke: rgba(244,248,248,0.4); stroke-width: 1; }
      .callout circle { fill: #EB826C; }
      .callout text   { fill: #F4F8F8; font-family: Orbitron, Arial, sans-serif;
                         font-size: 15px; }
      .caption { fill: rgba(244,248,248,0.55); font-family: Orbitron, Arial, sans-serif;
                  font-size: 14px; letter-spacing: 0.22em; }
      .stamp   { fill: rgba(244,248,248,0.4); font-family: Orbitron, Arial, sans-serif;
                  font-size: 13px; letter-spacing: 0.2em; }
    </style>
  </defs>

