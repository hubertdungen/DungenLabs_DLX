[build]
  publish = "."
  functions = "netlify/functions"

# ------------------------------------------------------------------
# Cabecalhos de seguranca — espelham os do dungenlabs.com.
# O checkout usa Stripe Payment Links (navegacao normal por <a href>),
# nao o SDK, por isso a CSP nao precisa de abrir script-src nem
# connect-src para a Stripe. Nao acrescentar dominios sem necessidade.
# ------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; form-action 'self'; upgrade-insecure-requests"

# O painel do Decap CMS carrega o bundle de um CDN e fala com a API do
# GitHub, o que a CSP do site nao permite. Fica isolado nesta rota.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; connect-src 'self' https://api.github.com https://unpkg.com; form-action 'self' https://github.com"

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/callback"
  to = "/.netlify/functions/callback"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/shop.html"
  status = 200

[[redirects]]
  from = "/shipping"
  to = "/shipping.html"
  status = 200

[[redirects]]
  from = "/thanks"
  to = "/thank-you.html"
  status = 200
